server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: policy-service
          uri: lb://policy-service
          predicates:
            - Path=/policies/**
        - id: claim-service
          uri: lb://claim-service
          predicates:
            - Path=/claims/**
        - id: approval-service
          uri: lb://approval-service
          predicates:
            - Path=/approvals/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
security:
  jwt:
    secret: ${JWT_SECRET:ChangeThisDevelopmentSecretKeyToAtLeast32Bytes!}
